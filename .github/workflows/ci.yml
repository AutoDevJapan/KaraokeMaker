name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked --no-default-features
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release
      - name: Assemble and verify Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory dist/KaraokeMaker | Out-Null
          Copy-Item target/release/karaoke-maker.exe dist/KaraokeMaker/KaraokeMaker.exe
          Copy-Item target/release/karaoke-maker-cli.exe dist/KaraokeMaker/karaoke-maker-cli.exe
          Copy-Item LICENSE dist/KaraokeMaker/
          (Get-Content docs/windows-package.md -Raw).Replace('[依存先の条件](dependencies.md)', '[依存先の条件](docs/dependencies.md)') | Set-Content dist/KaraokeMaker/README.md
          Copy-Item docs dist/KaraokeMaker/docs -Recurse
          Copy-Item dist/KaraokeMaker/README.md dist/KaraokeMaker/START-HERE.md
          New-Item -ItemType Directory dist/KaraokeMaker/third-party/demucs-core | Out-Null
          Copy-Item vendor/demucs-core/LICENSE,vendor/demucs-core/UPSTREAM.md dist/KaraokeMaker/third-party/demucs-core/
          Copy-Item third-party/RUST-NOTICES.txt dist/KaraokeMaker/third-party/RUST-NOTICES.txt
          $noticeText = Get-Content third-party/RUST-NOTICES.txt -Raw
          if ($noticeText -match '<year>|<copyright holders>|<owner>') { throw 'Unresolved generic copyright notice' }
          $provenance = Get-Content third-party/fixed-notices/provenance.json -Raw | ConvertFrom-Json
          foreach ($entry in $provenance) {
            $source = Join-Path third-party/fixed-notices "$($entry.crate)-$($entry.version)/$($entry.file)"
            $bytes = [Text.Encoding]::UTF8.GetBytes(([IO.File]::ReadAllText((Resolve-Path $source))).Replace("`r`n", "`n"))
            $actual = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLower()
            if ($actual -ne $entry.sha256) { throw "Changed fixed notice: $($entry.crate) $($entry.file)" }
          }
          Copy-Item third-party/fixed-notices dist/KaraokeMaker/third-party/fixed-notices -Recurse
          foreach ($doc in Get-ChildItem dist/KaraokeMaker -Filter '*.md' -Recurse) {
            foreach ($match in [regex]::Matches((Get-Content $doc.FullName -Raw), '\]\(([^)]+)\)')) {
              $link = $match.Groups[1].Value
              if ($link -match '^(https?://|mailto:|#)') { continue }
              $target = Join-Path $doc.DirectoryName ($link -split '#')[0]
              if (!(Test-Path -LiteralPath $target)) { throw "Broken packaged link in $($doc.Name): $link" }
            }
          }
          Compress-Archive -Path dist/KaraokeMaker -DestinationPath dist/KaraokeMaker-windows.zip
          Expand-Archive dist/KaraokeMaker-windows.zip dist/verify
          & ./dist/verify/KaraokeMaker/karaoke-maker-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI failed to start' }
          & ./dist/verify/KaraokeMaker/karaoke-maker-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI version check failed' }
          Get-FileHash dist/KaraokeMaker-windows.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  KaraokeMaker-windows.zip" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: karaoke-maker-windows
          if-no-files-found: error
          path: |
            dist/KaraokeMaker-windows.zip
            dist/SHA256SUMS.txt
