name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked --no-default-features
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release
      - name: Assemble and verify Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory dist/KaraokeMaker | Out-Null
          Copy-Item target/release/karaoke-maker.exe dist/KaraokeMaker/KaraokeMaker.exe
          Copy-Item target/release/karaoke-maker-cli.exe dist/KaraokeMaker/karaoke-maker-cli.exe
          Copy-Item LICENSE dist/KaraokeMaker/
          Copy-Item docs/windows-package.md dist/KaraokeMaker/README.md
          Copy-Item docs dist/KaraokeMaker/docs -Recurse
          Copy-Item docs/windows-package.md dist/KaraokeMaker/START-HERE.md
          New-Item -ItemType Directory dist/KaraokeMaker/third-party/demucs-core | Out-Null
          Copy-Item vendor/demucs-core/LICENSE,vendor/demucs-core/UPSTREAM.md dist/KaraokeMaker/third-party/demucs-core/
          $metadataText = cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Dependency metadata failed' }
          $metadata = $metadataText | ConvertFrom-Json
          $noticeRoot = 'dist/KaraokeMaker/third-party/rust'
          New-Item -ItemType Directory $noticeRoot | Out-Null
          foreach ($package in $metadata.packages) {
            if ($package.id -eq $metadata.resolve.root) { continue }
            $source = Split-Path $package.manifest_path
            $notices = @(Get-ChildItem -LiteralPath $source -File | Where-Object { $_.Name -match '^(LICENSE|LICENCE|COPYING|NOTICE|COPYRIGHT)' })
            if ($package.license_file) {
              $declared = Join-Path $source $package.license_file
              if (!(Test-Path -LiteralPath $declared -PathType Leaf)) { throw "Missing declared license: $($package.name)" }
              $notices += Get-Item -LiteralPath $declared
            }
            if ($notices.Count -eq 0) { throw "Missing dependency notices: $($package.name) $($package.version)" }
            $destination = Join-Path $noticeRoot "$($package.name)-$($package.version)"
            New-Item -ItemType Directory $destination | Out-Null
            $notices | Sort-Object FullName -Unique | Copy-Item -Destination $destination
            "$($package.name) $($package.version)`nLicense: $($package.license)`nRepository: $($package.repository)" | Set-Content (Join-Path $destination 'PACKAGE.txt')
          }
          foreach ($doc in Get-ChildItem dist/KaraokeMaker -Filter '*.md' -Recurse) {
            foreach ($match in [regex]::Matches((Get-Content $doc.FullName -Raw), '\]\(([^)]+)\)')) {
              $link = $match.Groups[1].Value
              if ($link -match '^(https?://|mailto:|#)') { continue }
              $target = Join-Path $doc.DirectoryName ($link -split '#')[0]
              if (!(Test-Path -LiteralPath $target)) { throw "Broken packaged link in $($doc.Name): $link" }
            }
          }
          Compress-Archive -Path dist/KaraokeMaker -DestinationPath dist/KaraokeMaker-windows.zip
          Expand-Archive dist/KaraokeMaker-windows.zip dist/verify
          & ./dist/verify/KaraokeMaker/karaoke-maker-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI failed to start' }
          & ./dist/verify/KaraokeMaker/karaoke-maker-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI version check failed' }
          Get-FileHash dist/KaraokeMaker-windows.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  KaraokeMaker-windows.zip" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: karaoke-maker-windows
          if-no-files-found: error
          path: |
            dist/KaraokeMaker-windows.zip
            dist/SHA256SUMS.txt
